name: Update stock quotes (Twelve Data)

on:
  schedule:
    - cron: "15 * * * *"   # every hour at :15
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout MAIN (run the python script from here)
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          path: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch quotes
        working-directory: main
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python scripts/fetch_quotes_twelvedata.py

      # ✅ DEBUG 1: print the file created on MAIN
      - name: DEBUG - show generated quotes.json (main)
        working-directory: main
        run: |
          echo "===== main/docs/assets/quotes.json ====="
          ls -lah docs/assets || true
          python -c "import json; p='docs/assets/quotes.json'; d=json.load(open(p)); print('keys:', list(d.keys())[:20]); print('AAPL:', d.get('AAPL'))"
          echo "----- raw file -----"
          cat docs/assets/quotes.json

      # 2) Checkout GH-PAGES (this is what your live site serves)
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: true
          path: pages

      # 3) Copy the generated quotes file into the live location
      - name: Copy quotes.json into gh-pages
        run: |
          mkdir -p pages/assets
          cp main/docs/assets/quotes.json pages/assets/quotes.json

      # ✅ DEBUG 2: show exactly what will be committed on GH-PAGES
      - name: DEBUG - show gh-pages quotes.json before commit
        run: |
          echo "===== pages/assets/quotes.json ====="
          ls -lah pages/assets || true
          python -c "import json; p='pages/assets/quotes.json'; d=json.load(open(p)); print('keys:', list(d.keys())[:20]); print('AAPL:', d.get('AAPL'))"
          echo "----- raw file -----"
          cat pages/assets/quotes.json
          echo "----- git diff (if any) -----"
          cd pages
          git diff -- assets/quotes.json || true

      # 4) Commit ONLY the live quotes.json (on gh-pages) if changed
      - name: Commit quotes.json if changed (gh-pages)
        run: |
          cd pages
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assets/quotes.json
          git commit -m "Update quotes.json" || exit 0
          git push
